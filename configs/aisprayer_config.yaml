# AiSprayer 统一生产配置文件

# 1. 硬件层配置 (Hardware)
hardware:
  camera:
    model: "orbbec"             # 可选: orbbec, realsense
    width: 1280
    height: 800
    fps: 15
    enable_depth_align: true    # 启用深度图到彩色图 D2C 对齐
    
    # 视频流与硬件硬解/硬编码参数
    streaming:
      app: "live"
      stream_id: "orbbec_color"
      width: 1280
      height: 800
      fps: 30
      bitrate_kbps: 2500        # H.264 目标码率 (2.5Mbps)
      gop: 30                   # 1秒关键帧间隔
    
    # 微服务服务端口与运行参数
    server:
      http_port: 18080          # 相机微服务 REST API 监听端口
      zlm_http_port: 8008       # WebRTC / HTTP-FLV 监听端口 (独立端口，避免与 FastAPI 8000 冲突)
      rtsp_port: 8554           # RTSP 监听端口
      rtmp_port: 1935           # RTMP 监听端口
      stats_interval_sec: 10    # C++微服务周期性性能/健康统计打印间隔 (秒, 0 表示静默)
      data_root: "data"         # 相对项目根目录的落地存储目录

  robot:
    type: "dobot"               # 可选: inexbot, dobot
    ip: "192.168.5.1"           # 机械臂控制器 IP
    port: 29999                 # 机械臂控制端口 (dobot 默认 29999, inexbot 默认 6001)
    global_speed_factor: 50     # 示教/远程/运行全局速度百分比 (startup 时 set_speed)
    max_tcp_speed_mm_s: 2000    # robot cr5最大线速度为2000mm/s, 在控制软件中设置
    max_joint_speed_deg_s: [180, 180, 180, 180, 180, 180]  # robot cr5最大关节速度为180度/s, 在控制软件中设置
    robot_urdf: "app/urdf/cr5_robot_with_my_tools.urdf" # cr5_robot.urdf/cr5_robot_with_gun.urdf
    robot_tcp_id: 1             # 机械臂末端工具坐标系ID: 默认 0 (法兰/工具0), 配置为 1 则是 gripper_tip_link (夹爪), 2 是 laser_head_link (激光头)
    robot_tcp: "gripper_tip_link"  # 对应的 URDF TCP 节点名称 (laser_head_link / gripper_tip_link)
    spray_do_index: 1           # 喷涂开关 DO 端子编号 (1-16, 默认 1; 预留后续扩展 purge_do_index 清洗, blow_do_index 吹气等)
    home_position: [180.0, 0.0, 90.0, 90.0, 90.0, 0.0]  # 机械臂原点/复位关节角 (单位: 度, [J1, J2, J3, J4, J5, J6])
    fold_position: [186.0, 0.0, 159.0, 18.0, 176.0, 0.0]  # 机械臂折叠/收纳关节角 (单位: 度, [J1, J2, J3, J4, J5, J6])
    #home_position: [0.0, 0.0, -90.0, -90.0, -90.0, 0.0]  # 机械臂原点/复位关节角 (单位: 度, [J1, J2, J3, J4, J5, J6])
    #fold_position: [0.0, 0.0, -156.0, 0.0, -170.0, 0.0]  # 机械臂折叠/收纳关节角 (单位: 度, [J1, J2, J3, J4, J5, J6])

# 2. 标定算法配置 (Calibration)
calib:
  # 相机安装方式默认值, 决定新建标定会话采用哪套手眼模型:
  #   eye-to-hand (眼在手外): 相机固定于基座, 标定板装在法兰上 -> 求解 T_base_camera
  #   eye-in-hand (眼在手上): 相机装在法兰上, 标定板固定于世界 -> 求解 T_flange_camera
  # 仅作为新建会话的默认值, 每个会话在创建时记录自己的安装方式。
  mount: "eye-to-hand"

  capture:
    output_dir: "data/calib"    # 标定采集数据存储根目录
  
  # 标定计算结果保存路径 (默认与视觉规划引用的路径一致)
  result_path: "configs/calib/calibration_result.yaml"
  
  # 数据清洗阈值 (允许视觉位移与物理位移的偏差比例，0.05 代表 ±5%)
  cleaning_threshold: 0.05
  
  board:
    rows: 12                    # 标定板行数 (节点数)
    cols: 9                     # 标定板列数 (节点数)
    square_size_mm: 15.0        # 棋盘格格子大小 (mm)
  
  # RootPoint 安全点位数据库路径
  root_points_path: "data/calib/root_points.yaml"

# 3. 喷涂与规划作业参数 (Spraying & Planning)
spraying:
  output_root: "data/runs"      # 生产运行数据存储根目录
  calib_path: "configs/calib/calibration_result.yaml"
  model_path: "models/wissight.pt"
  spray_dist_mm: 150          # 默认喷涂靶距 / TCP standoff 距离 (mm)
  spray_width_mm: 60.0         # 喷涂幅宽 (mm)
  overlap_rate: 0.2             # 喷幅重叠率 (0~1.0)
  point_spacing_mm: 100.0        # 沿行点间距 (mm)
  velocity: 150.0               # 喷涂移动速度 (mm/s)
  slerp_step_mm: 2.0            # 仿真与运动学验证插值步长 (mm)

  # POI 锚点(容差包络中心)来源:
  #   config = 用下面的 poi_ref_rpy_deg 作为整条路径共用的固定锚点
  #   home   = 用 Home 关节角 [0,0,-90,-90,-90,0] 正解出的 TCP 姿态作为锚点
  #   raw    = 逐点以航点自身的名义(法向)姿态为锚点, 即"每个点在自己法向 ±容差内选姿态"(最严格的法向跟随)
  # 页面/接口显式传入 poi_config.anchor_source 时以传入值为准; live(机械臂当前 TCP)由后端接口解析成具体 ref_rpy 后下发
  poi_anchor_source: "raw"
  # 锚点参考姿态 [Rx, Ry, Rz] (单位: 度, Euler 'xyz'), 仅 poi_anchor_source: config 时生效
  poi_ref_rpy_deg: [90.0, 0.0, 90.0]

  # POI 锚点姿态容差包络 [Rx, Ry, Rz] (单位: ±度, 页面默认值)
  # Rz 收到 ±30 是为禁止绕喷枪轴自由自旋: 之前 ±180 时自旋几乎只由 DP 平滑项决定,
  # 会翻到欧拉角另一侧并连带换 IK 分支(Δq_max 达 170°), 直接顶出 J6 超速
  # poi_tolerance_rpy_deg: [30.0, 30.0, 180.0] # for config
  poi_tolerance_rpy_deg: [10.0, 10.0, 180.0] # for raw

  # 轨迹优化器候选姿态搜索网格 [min, max, step] (单位: 度)
  # 候选姿态 = 名义(法向)姿态 × 本网格, 再裁剪进上面的锚点包络; 网格范围应不小于包络
  # x/y 用 ±15 (> ±10 包络): 网格若窄于包络, DP 搜到的是被截断的子集, 够不到能避开
  # 肘部奇异(|J3|->0)的姿态, 会残留 ELBOW_SINGULARITY 告警; 放宽后指向偏量不变(见扫描)
  grid_tol_x_deg: [-15.0, 15.0, 2.0]     # 绕工具 X 轴倾斜容差与采样步长
  grid_tol_y_deg: [-15.0, 15.0, 2.0]     # 绕工具 Y 轴倾斜容差与采样步长
  grid_tol_z_deg: [-30.0, 30.0, 5.0]     # 绕工具 Z 轴自旋容差与采样步长

  # 容差阶梯择优 (Monotonicity Guard)：大容差包络几何上包含小容差, 但 DP 目标 J=ΣΔq²+姿态偏置
  # 不含峰值角速度, 且候选集/beam 剪枝都随容差变化 —— 实测 [10,10,50]→43.6°/s 而 [30,30,180]→133.8°/s。
  # 开启后按“请求包络 + 逐档收紧(×比例)”各跑一次完整 DP+校验, 按 [校验状态→峰值/限速→J] 字典序取最优,
  # 从而构造性地保证“大容差不劣于其包含的小容差”。CLI 显式传参 (--no-tol-ladder 等) 优先级高于此处。
  tol_ladder: true
  # 收紧比例 (每档 = 请求包络 × 比例, 逐分量); 每档都 ⊆ 请求包络, 故采纳解一定落在用户设定的包络内
  tol_ladder_scales: [0.5, 0.333333, 0.25]
  # 早停阈值：某档 PASS 且 峰值/关节限速 ≤ 此比例时不再继续收紧 (0=跑完全部档); 0.3×179.91≈54°/s
  tol_ladder_stop_peak_ratio: 0.3
  # 指向偏量护栏：收紧包络会用“喷嘴偏离表面法向”换“更低峰值”(实测 18.7°→45.9°)。
  # >0 时, 某档最大指向偏量 > 请求档 + 此值就弃用该档 (宁可峰值高也不牺牲涂层质量); 0=不限制
  tol_ladder_max_pointing_deg: 0.0

  # ⑤-A 腕部奇异(|J5|→0)自适应降速总开关 (motion_cli 与执行侧同源读此键):
  #   true  = 优化器/校验器按 |sin(J5)| 可操作度在近奇异段缩放 dt, 并把逐航点建议速度剖面
  #           (verification.path_reports[].waypoint_speed_mm_s) 落盘; 执行侧读取该剖面真实压低
  #           近奇异航点的 TCP 线速度 (eff = speed_l × 剖面/nominal, 只降不升, 队列内覆写 TCPSpeed 不阻断 CP)。
  #   false = 模型与真机速度均不改变 (零回归)。
  singularity_speed_scaling: true
  singularity_ref_deg: 25.0    # |J5| ≥ 此角度(deg) 视为远离奇异, 不减速; 越接近 0 减速越多
  singularity_min_scale: 0.2   # 减速下限比例 (近奇异段最多降到名义速度的 20%)

  # 喷枪开/关物理响应延迟补偿 (ms): 下发对应队列 DO 后驻留此时长再继续下发本段 MoveL,
  # 用于覆盖喷枪建压开喷 / 完全断料的机械延迟。0 (默认) = 不驻留, 保持原有 CP 连续行为。
  spray_on_delay_ms: 0
  spray_off_delay_ms: 0

# 4. 工位跟随 (Follow) —— 特征前端 + 配准 + 判据 + 臂侧镜像
# 这一份 `follow:` 块有两个读者，跑的是同一套数学：
#   ① 相机服务内的 follow 库（默认**关闭**，页面上点"启动"才使能；见 follow_worker.cpp）
#      —— 以及它上面的 app 后端 apps/follow（把修正量镜像成仿真臂关节角）。
#   ② 独立自测进程 `follow_pose`（不依赖任何服务，直接吃相机，是①行为的可验证对照）。
# 分辨率刻意不继承 hardware.camera：那一块是给推流/标定用的 1280x800，而本模块的预算由
# follow_bench_frontend 在真实工位图上量出来。下面每个数都能追到一次测量，改之前先重跑量具。
follow:
  mount: "eye-to-hand"          # 眼在手上时相机在法兰上，臂一动图像就变，「工件动了」与「相机动了」纯视觉不可辨识：必须按帧减掉臂反馈，那是独立阶段（P5），不是一个开关

  camera:
    width: 640                  # 硬件 D2C 对齐支持的最大分辨率为 640x480 (848x480 及以上仅支持软对齐)
    height: 480                 # 640x480 走硬件 D2C (ASIC 芯片计算，0% 主机 CPU 占用)
    fps: 15                     # 640x480@15fps：单帧 40ms < 66.7ms 预算，0丢帧且大幅降低总CPU占用
    lock_path: ".orbbec.lock"   # 全项目唯一的相机 flock（相对项目根），路径以本键为准；相机服务启动即持有，独立工具拿不到就报"被 PID x 占用"
    frame_timeout_ms: 1000
    first_pair_timeout_ms: 3000 # 彩色比深度晚上线约 333 ms，等第一个「成对」帧组才算就绪
    allow_unaligned: false      # true 会让深度/彩色各用一套内参（基线 23.735mm），只给排障
    enable_imu: true            # 开启板载 6 轴 IMU 陀螺仪数据流并注入跟踪器

  frontend:
    kind: "cpu"                 # cpu | superpoint(需板端 .rknn，本板转不出来)
    max_features: 200
    quality_level: 0.01
    min_distance_px: 16
    rknn_model_path: "superpoint.rknn"

  track:
    zmin_m: 0.30
    zmax_m: 3.50                # 实测数据集深度 0.74~2.59 m
    depth_stride: 3
    voxel_m: 0.020
    max_corr_m: 0.050            # 实际生效门 = min(此值, 2.6*voxel_m), 增大 GICP 点云配准搜索半径。大幅度快速移动时，相邻两帧的位移更大，调大后能让算法在大跨度位移下依然能找到对应点收敛。
    threads: 4                  # 绑 4 个 A76，不要 8
    max_iters: 35                # 增加 GICP 最大迭代步数。大位移/大旋转需要更多步迭代来拉回位姿（目前单帧耗时仅 40ms，完全有算力余量）。
    min_cloud_points: 200
    min_gicp_inliers: 80
    trans_sigma_mm: 2.0         # 可观测门：好场景实测 0.15~0.19 mm
    rot_sigma_deg: 0.2
    group_anisotropy: 15.0      # 工件 8.9~10.1，整幅大平面 31.6/26.7
    min_inlier_ratio: 0.05      # 低于此 = 出了示教包络，要重新示教而不是"跟丢", 降低示教重叠率门限。当前与示教地图只需 5%~8% 重叠依然允许跟踪，允许相机移动到视野边缘更远的位置而不触发 out_of_envelope。
    max_sparse_streak: 15
    # P3 离群门（动态门限）：门 = gyro_rot_gate_deg + gyro_rot_gate_relax × 本区间陀螺实际转角。
    # 旧的 10° 绝对门限已被真机证伪：15fps 下单帧 66ms、转到 115°/s 也只转 7.6°，任何视觉解都在
    # 10° 以内 ⇒ 手持旋转全程 0 次触发，两帧 lost 全靠 GICP 自己失败才发现（评审报告 §13.3）。
    # 绝对门限注定"低速误伤 / 高速惰性"二选一；跟着转角缩放后，帧间隔与被 hold 的帧数也被自动
    # 吸收（区间越长门越宽），下限才敢收到 2°。
    gyro_rot_gate_deg: 2.0      # 零速下限（0=关整个门）：正常帧视觉 vs 陀螺只差噪声级 0.0 几度
    gyro_rot_gate_relax: 0.5    # 每转 1° 放宽 0.5°（115°/s 单帧 ⇒ 门 5.8°）。≥1 等于回到惰性门限，建议 0.3~0.6
    # ---- P1 静止检测：判据是**减掉零偏之后的残差模**，不是 |ω| 本身 ----
    # 336L 实测静止时 |ω| 平均 0.99°/s 且峰值≈均值（恒定值＝零偏，不是抖动）。旧版直接对 |ω|
    # 设 1.15°/s 的门只剩 16% 余量，零偏一随温度漂就静默失效；减掉零偏后才压得到噪声级。
    gyro_still_enter_dps: 0.45  # 残差低于它 ⇒ 连续 confirm 个样本后宣布静止（慢进）
    gyro_still_exit_dps: 0.60   # 残差高于它 ⇒ 立刻解冻（快出）。必须 > enter，否则迟滞消失
    gyro_still_window: 20       # 均值窗口样本数（@200Hz=100ms）。按样本数不按毫秒：检测器不认时间轴
    gyro_still_confirm: 20      # 进入静止要连续多少个样本低于 enter
    gyro_bias_bootstrap: 100    # 开机/示教后前 N 个样本取累积均值当零偏（@200Hz=0.5s；示教完成时相机正静置在桌上，0.5s即可瞬间完成精确零偏定标，防止5秒过长导致拿起相机时的运动被误当成零偏）
    gyro_bias_alpha: 0.001      # 之后只在安静期用小 α 的 EMA 跟热漂移（τ≈5s）。不门控会把匀速转动吸进零偏
    gyro_max_freeze_ms: 0    # 单次冻结时限（ms）：0=不限（不推荐）。建议 3000~10000，防止恒定慢转/零偏漂移导致旋转输出无限期冻结
    gyro_horizon_ms: 1000       # 缓冲跨度（ms）。①② 的积分窗口只有 ~66ms，这一项是"样本能在缓冲里等多久"：
                                # USB 抖动 350~450ms 时必须 >= 那一档，否则窗口框空；时间域对齐后它只是余量，
                                # 不是根因。过长会把旧零偏也积进来，1s 足够。
    sparse_inlier_dist_m: 0.02
    sparse_min_inliers: 12

  teach:
    map_path: "app/src/core/follow/out/reference.frmap"
    frames: 20                  # 采集 10 帧做时间域深度均值去噪融合，消除初始散斑噪声
    max_motion_deg_s: 2.0       # P2 示教静止门：收帧窗口内陀螺平均角速度超此值 ⇒ 拒绝示教（0=关，无 IMU 自动跳过）
                                # 注意这里刻意用**绝对 |ω|**（示教时没有安静期可估零偏）：实测零偏
                                # ≈0.99°/s，所以真正允许的"手不稳"额度只有 ~1°/s，别再往小调

  runtime:
    dry_run: true               # 只打印修正量，不发臂。P5 控制层接入前 false 也会被强制回 true
    enable_servo_p: false
    health_port: 18081          # 18080 属于相机服务，8008 属于 ZLM
    max_cycles: 0               # 0 = 一直跑
    calib_path: "configs/calib/calibration_result.yaml"
    log_level: "info"

  # 臂侧镜像：把上面的相机系修正量换算成 CR5 关节角，喂给页面的仿真臂。
  # C++ 侧只解析+校验这一段（读到同一份配置就得对同一份配置负责），真正的消费方是 app 后端
  # apps/follow/services/follow_service.py。
  arm:
    mode: "sim"                 # sim = 只驱动页面仿真臂；real = 真实臂开关，P5 控制层接入前点击即被拒绝
    home_joints_deg: [0.0, 0.0, -90.0, -90.0, -90.0, 0.0]
                                # = DobotDriver.go_home() 那一档。"启动"先把仿真臂摆到这里，并把
                                #   它锁成基线（不是实时位姿 —— 用实时位姿当基准会形成正反馈）
    camera_to_base_fallback_euler_deg: [0.0, 0.0, 0.0]
                                # 手眼标定缺失/为 eye-in-hand 时的退路 R_cb：基座系下相机轴朝向
                                #   [rx,ry,rz]，R = Rz·Ry·Rx，单位度。这是**降级**（方向会有偏差），
                                #   用的是哪一个会写进状态的 r_cb_source，不会悄悄生效
    poll_hz: 20                 # **兜底**轮询率（1~50）：只在推送判为不活跃时生效，见下面 push/push_stale_ms。
                                #   数据面已改为相机服务**推**（SSE /api/v1/camera/follow/stream），
                                #   控制面（启动/调零/停止/示教）仍是原来的 HTTP 请求-响应，没动
    emit_hz: 33                 # 仿真臂 joints 发射频率：关节空间限速插值后按此频率推给页面（5~100）
    push: true                  # 实时位姿走服务端推送；false = 退回纯轮询（服务端没编到该路由时用，
                                #   行为与改动前完全一致）。关掉它不会让跟随变差，只是不再低延迟
    push_stale_ms: 400          # 推送连续静默多久就判"此刻不算数"、由 poll_hz 接管（200~5000）。
                                #   下限要容得下服务端 200ms 心跳 + 一帧周期（15fps≈66ms）；
                                #   留太长的后果是臂跟着一个半秒前的位姿走，那比延迟高更糟
    max_joint_vel_deg_s: 90.0   # 平滑器限速：插值段时长由它决定，保证相邻发射点关节角变化率不超此值
    teach_save_map: true        # 示教时把参考地图落盘到 teach.map_path（false = 只在内存里，重启即失）

# 5. 交互式分割 (MobileSAM)
interactive:
  sam:
    backend: "auto"             # 可选: auto (自动探测: RK3588走RKNN, PC有GPU走CUDA, 无GPU走ONNX), rknn, onnx, pt/cuda/cpu
  detector:
    # 进入交互分割时先用 wissight 检出衣物，把框当 MobileSAM 的初始 box prompt（检不到则回退手动点选）
    enabled: true
    sam_refine: false              # true: 检出的框交 MobileSAM 精修; false: 直接用 wissight 自己的实例 mask（不跑 MobileSAM）
    backend: "auto"             # 可选: auto (RK3588 走 .rknn/NPU, 其他平台 .onnx, 只有权重时 .pt), rknn, onnx, pt
    classes: ["trousers"]       # 当成目标的类别，空列表 = 不过滤；可选值见 core/vision/image2d/wissight_detector.py:CLASS_NAMES
    conf: 0.25                  # 置信度阈值：实测 0.25 结果干净，降到 0.10 会混进 sling/shirt 等误类
    iou: 0.7                    # NMS IoU 阈值
    max_boxes: 5                # 回传给界面的最大候选框数（按面积降序，第一个当主体）

